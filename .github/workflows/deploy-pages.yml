# Deploy alternativo a Cloudflare Pages vía wrangler.
#
# Flujo principal (recomendado): integración Git del dashboard de Cloudflare
#   git push a main → Cloudflare Pages detecta el push → npm run build → deploy automático.
#
# Este workflow es la alternativa vía CI. Para activarlo seteá el repo variable
# CLOUDFLARE_PAGES_DEPLOY=true (Settings → Secrets and variables → Actions → Variables)
# y los secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
# Si usás la integración Git del dashboard, dejalo desactivado para evitar dobles deploys.

name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro SSR → dist/)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=real-estate-broker --branch=main
