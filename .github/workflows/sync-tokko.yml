name: Sync Tokko

on:
  schedule:
    # Cada 6 hs (UTC), desfasado de :00 para evitar congestión de cron en el minuto 0
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No escribir ni commitear (sólo ejecutar y reportar)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-tokko
  cancel-in-progress: false

jobs:
  sync:
    name: Pull de stock desde Tokko
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test del mapper (fixtures, sin red)
        run: node scripts/sync/main.mjs --self-test

      - name: Sincronizar stock
        id: sync
        env:
          TOKKO_API_KEY: ${{ secrets.TOKKO_API_KEY }}
        run: |
          if [ -z "$TOKKO_API_KEY" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TOKKO_API_KEY no configurado — sync omitido (creá el secret para habilitarlo)."
            exit 0
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/sync/main.mjs --dry-run
          else
            node scripts/sync/main.mjs
          fi
          if git diff --quiet -- src/data/properties.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin cambios en el inventario."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/properties.json
          git commit -m "chore(sync): stock Tokko $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main
